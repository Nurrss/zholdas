  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 488px; box-sizing: border-box; padding: 22px 24px 28px; border-radius: 32px 32px 0 0; background: #0F2236; border-top: 1px solid #1E3A55; display: flex; flex-direction: column; box-shadow: 0 -16px 40px rgba(0,0,0,0.45)">

    <div style="display: flex; align-items: center; gap: 14px">

          <div style="font-size: 15px; color: #8FB3C4">говорит</div>
        </div>
      </div>
    </div>

    <div style="margin-top: 14px; padding: 18px 20px; border-radius: 6px 24px 24px 24px; background: #FFFFFF; color: #0F2236; font-size: 23px; font-weight: 500; line-height: 1.3">Ты уже 2 часа за рулём. Через 12 км заправка — остановимся на чай?</div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 18px">

        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#0F2236" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>

        <div style="width: 6px; height: 24px; border-radius: 3px; background: #5FC7D4"></div>
        <div style="width: 6px; height: 44px; border-radius: 3px; background: #5FC7D4"></div>
        <div style="width: 6px; height: 16px; border-radius: 3px; background: #5FC7D4"></div>
        <div style="width: 6px; height: 30px; border-radius: 3px; background: #5FC7D4; opacity: 0.8"></div>
        <div style="width: 6px; height: 20px; border-radius: 3px; background: #5FC7D4; opacity: 0.65"></div>
        <div style="width: 6px; height: 10px; border-radius: 3px; background: #5FC7D4; opacity: 0.5"></div>

    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="Drive.html" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 18px; box-sizing: border-box; border: 2px solid #5A7A92; color: #FFFFFF; text-decoration: none; font-size: 21px; font-weight: 600">Позже</a>
      <button type="button" style="height: 64px; border-radius: 18px; border: 0; background: #3FB97F; color: #0F2236; font-family: Rubik, system-ui, sans-serif; font-size: 21px; font-weight: 700; cursor: pointer">Да, на чай</button>
    </div>
  </div>
</div>
