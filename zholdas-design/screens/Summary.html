<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Жолдас — итоги поездки</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F2236}a:hover{color:#0F2236}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 28px; display: flex; flex-direction: column; background: #E6EEF0; font-family: Rubik, system-ui, sans-serif; color: #0F2236; overflow: hidden">

  <div style="font-size: 15px; font-weight: 500; color: #3D5468">Поездка завершена</div>
  <div style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em; margin-top: 2px">Тараз → Алматы</div>

  <div style="display: flex; align-items: center; gap: 16px; margin-top: 18px">
    <img src="../avatar/calm.png" alt="Жолдас доволен" style="width: 140px; height: 140px; border-radius: 50%; object-fit: cover; display: block; box-sizing: border-box; border: 4px solid #FFFFFF; background: #EEEEEE; box-shadow: 0 10px 28px rgba(15,34,54,0.14); flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 32px; font-weight: 700; line-height: 1">Жарайсың!</div>
      <div style="font-size: 18px; line-height: 1.3; color: #24384C">Доехали. Спасибо, что берёг себя.</div>
    </div>
  </div>

  <div style="margin-top: 18px; padding: 18px 20px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 16px; color: #3D5468">Время в пути</div>
      <div style="font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em">4 ч 10 мин</div>
    </div>
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#137C89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px">
    <div style="padding: 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FCE5D4; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A64E0E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="15" rx="3" ry="2.5"></ellipse><path d="M8 9h.01M16 9h.01"></path></svg>
      </div>
      <div style="font-size: 44px; font-weight: 700; line-height: 1">2</div>
      <div style="font-size: 18px; color: #24384C">зевка</div>
    </div>
    <div style="padding: 18px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FADADB; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B42328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"></path><path d="M12 10v4M12 17h.01"></path></svg>
      </div>
      <div style="font-size: 44px; font-weight: 700; line-height: 1">1</div>
      <div style="font-size: 18px; color: #24384C">тревога «Не спи!»</div>
    </div>
  </div>

  <div style="margin-top: 12px; padding: 18px 20px; border-radius: 24px; background: #0F2236; color: #FFFFFF; display: flex; align-items: flex-start; gap: 14px">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5FC7D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 10h2a2 2 0 0 1 0 4h-2"></path><path d="M8 2v3M12 2v3"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; color: #8FB3C4">Совет</div>
      <div style="font-size: 24px; font-weight: 600; line-height: 1.2">Отдыхай каждые 2 часа</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 0 4px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2C7A4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <div style="font-size: 15px; color: #3D5468">Видео не сохранялось и не отправлялось</div>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Main.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 22px; background: #1B9AAA; color: #0F2236; text-decoration: none; font-size: 26px; font-weight: 700">Готово</a>
</div>
</x-dc>

</body>
</html>
